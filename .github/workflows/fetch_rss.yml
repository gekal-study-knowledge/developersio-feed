name: Fetch RSS and Update Posts

on:
  schedule:
    # 1時間ごとに実行
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/scripts/requirements.txt

      - name: Run RSS script
        run: python .github/scripts/fetch_rss.py

      - name: Commit and push if changed
        id: commit_and_push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add _posts/
          if [ -n "$(git status --porcelain _posts/)" ]; then
            git commit -m "Update RSS feed: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            echo "No changes in _posts/, skipping commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

  call_deploy:
    needs: fetch-rss
    if: needs.fetch-rss.outputs.pushed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      branch_name: ${{ github.ref_name }}
